<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успішна! | Влада Царенко</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #1C1C1C; color: #ffffff; font-family: sans-serif; }
    </style>
    
    <!-- Meta Pixel Code (Purchase Event) -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // ЗАМІНІТЬ YOUR_PIXEL_ID НА ВАШ
    fbq('init', 'YOUR_PIXEL_ID'); 
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>
<body class="flex items-center justify-center min-h-screen text-center px-4">

    <div class="max-w-md w-full bg-[#262626] border border-[#404040] rounded-2xl p-8 shadow-2xl">
        <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6 text-green-500">
            <i data-lucide="check" class="w-10 h-10"></i>
        </div>
        
        <h1 class="text-2xl font-black uppercase mb-4 text-white">Дякуємо за покупку!</h1>
        
        <div class="space-y-4 text-gray-300 text-lg leading-relaxed">
            <p>Ваша оплата пройшла успішно.</p>
            <p class="font-bold text-white border-t border-b border-white/10 py-4">
                Ми зв'яжемося з вами найближчим часом для узгодження дати та часу проведення діагностики.
            </p>
            <p class="text-sm text-gray-500">
                Перевірте, чи вказали ви правильний номер телефону/Telegram при оформленні.
            </p>
        </div>

        <!-- Кнопка повернення на головну (за бажанням, можна прибрати) -->
        <a href="/" class="inline-block mt-8 text-sm text-[#E63946] hover:text-white transition-colors underline decoration-2 underline-offset-4">
            Повернутися на головну
        </a>
    </div>

    <script>
        lucide.createIcons();
        
        // ВСТАВТЕ ТУТ ВАШЕ ПОСИЛАННЯ НА ГУГЛ СКРИПТ (Те саме, що і в index.html)
        const GOOGLE_SCRIPT_URL = 'YOUR_GOOGLE_SCRIPT_URL_HERE'; 

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderReference = urlParams.get('orderReference');
            
            // Трекінг покупки
            const savedAmount = localStorage.getItem('wfp_amount') || '390';
            fbq('track', 'Purchase', {value: savedAmount, currency: 'UAH'});

            // Оновлення статусу в таблиці (фоном)
            if(orderReference && GOOGLE_SCRIPT_URL !== 'YOUR_GOOGLE_SCRIPT_URL_HERE') {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: "update_payment_status",
                        orderId: orderReference,
                        status: "PAID_SUCCESS"
                    })
                }).then(() => {
                    console.log("Status updated to PAID");
                }).catch(err => {
                    console.error("Error updating status:", err);
                });
            }
        };
    </script>
</body>
</html>
