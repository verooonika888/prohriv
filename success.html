<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успішна! | Влада Царенко</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #1C1C1C; color: #ffffff; font-family: sans-serif; }
    </style>
    
    <!-- Meta Pixel Code (Purchase Event) -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // REPLACE WITH YOUR PIXEL ID
    fbq('init', 'YOUR_PIXEL_ID'); 
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>
<body class="flex items-center justify-center min-h-screen text-center px-4">

    <div class="max-w-md w-full bg-[#262626] border border-[#404040] rounded-2xl p-8 shadow-2xl">
        <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6 text-green-500">
            <i data-lucide="check" class="w-10 h-10"></i>
        </div>
        
        <h1 class="text-2xl font-black uppercase mb-4 text-white">Оплата успішна!</h1>
        <p class="text-gray-400 mb-8">Дякуємо за довіру. Зараз ми перенаправимо вас до бота.</p>
        
        <div id="loading" class="text-sm text-gray-500 animate-pulse">Оновлюємо статус замовлення...</div>
    </div>

    <script>
        lucide.createIcons();
        
        // CONFIG
        const GOOGLE_SCRIPT_URL = 'YOUR_GOOGLE_SCRIPT_URL_HERE'; // The same script URL
        const TELEGRAM_BOT_URL = 'YOUR_BOT_LINK_HERE'; // Link to your bot/channel

        window.onload = function() {
            // Get params from URL (WayForPay redirects here with params)
            const urlParams = new URLSearchParams(window.location.search);
            const orderReference = urlParams.get('orderReference'); // Our unique Order ID
            
            // We can try to get the real amount from params if WFP sends it, 
            // but tracking Purchase event usually needs value.
            // Let's grab amount from localStorage if we saved it before payment
            const savedAmount = localStorage.getItem('wfp_amount') || '390';
            
            fbq('track', 'Purchase', {value: savedAmount, currency: 'UAH'});

            if(orderReference) {
                // Send update request to Google Sheets
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: "update_payment_status",
                        orderId: orderReference,
                        status: "PAID_SUCCESS"
                    })
                }).then(() => {
                    setTimeout(() => { window.location.href = TELEGRAM_BOT_URL; }, 1500);
                }).catch(err => {
                    console.error(err);
                    // Redirect anyway even if script fails
                    setTimeout(() => { window.location.href = TELEGRAM_BOT_URL; }, 2000);
                });
            } else {
                // If no orderReference, just redirect
                setTimeout(() => { window.location.href = TELEGRAM_BOT_URL; }, 2000);
            }
        };
    </script>
</body>
</html>
